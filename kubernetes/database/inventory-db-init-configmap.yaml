apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-db-init
  namespace: cake-delight
  labels:
    app: inventory-db
data:
  init.sql: |
    USE cake_inventory;
    
    CREATE TABLE IF NOT EXISTS inventory (
        cake_id CHAR(36) PRIMARY KEY,
    
        cake_name VARCHAR(160) NOT NULL,
    
        stock_quantity INT NOT NULL DEFAULT 0,
    
        reserved_quantity INT NOT NULL DEFAULT 0,
    
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            ON UPDATE CURRENT_TIMESTAMP,
    
        CONSTRAINT chk_stock
            CHECK (stock_quantity >= 0),
    
        CONSTRAINT chk_reserved
            CHECK (reserved_quantity >= 0)
    );
    
    
    CREATE TABLE IF NOT EXISTS stock_reservations (
        id CHAR(36) PRIMARY KEY,
    
        event_id CHAR(36) NOT NULL UNIQUE,
    
        order_id CHAR(36) NOT NULL,
    
        order_number VARCHAR(30) NOT NULL,
    
        status VARCHAR(30) NOT NULL,
    
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            ON UPDATE CURRENT_TIMESTAMP
    );
    
    
    CREATE TABLE IF NOT EXISTS stock_reservation_items (
        id CHAR(36) PRIMARY KEY,
    
        reservation_id CHAR(36) NOT NULL,
    
        cake_id CHAR(36) NOT NULL,
    
        quantity INT NOT NULL,
    
        CONSTRAINT fk_reservation
            FOREIGN KEY (reservation_id)
            REFERENCES stock_reservations(id)
            ON DELETE CASCADE
    );
    
    
    CREATE INDEX idx_reservation_items_cake
    ON stock_reservation_items(cake_id);
    
    
    -- ============================================================
    -- SEED DATA
    -- ============================================================
    --
    -- Stock mirrors the seeded catalogue. Cake identifiers match
    -- database/catalog.sql. Cakes added to the catalogue later are
    -- provisioned automatically by the Inventory Service the first
    -- time they appear on an order.completed event.
    -- ============================================================
    
    INSERT INTO inventory
    (
        cake_id,
        cake_name,
        stock_quantity,
        reserved_quantity
    )
    VALUES
        ('11111111-1111-4111-8111-111111111111', 'Belgian Chocolate Truffle', 24, 0),
        ('22222222-2222-4222-8222-222222222222', 'Dark Chocolate Fudge',      18, 0),
        ('33333333-3333-4333-8333-333333333333', 'Strawberry Celebration',    15, 0),
        ('44444444-4444-4444-8444-444444444444', 'Mixed Berry Delight',       12, 0),
        ('55555555-5555-4555-8555-555555555555', 'Red Velvet Dream',          20, 0),
        ('66666666-6666-4666-8666-666666666666', 'Vanilla Celebration Tier',   6, 0)
    ON DUPLICATE KEY UPDATE
        cake_name = VALUES(cake_name);
