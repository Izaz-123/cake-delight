# ============================================================
# Database credentials
# ============================================================
#
# Kept out of the ConfigMaps so connection strings and credentials are
# managed separately. stringData is used so the value stays readable;
# Kubernetes stores it base64 encoded.
#
# Rotate this value before any deployment outside a local cluster.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: cake-delight
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "Root@123"
  DB_PASSWORD: "Root@123"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: cake-delight
type: Opaque
stringData:
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
