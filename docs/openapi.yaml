openapi: 3.0.3

info:
  title: Cake Delight API
  description: |
    REST API for the Cake Delight cloud native microservices application.

    Every endpoint is served through the API Gateway, which routes to the
    Catalog, Rating, Order, Inventory, Notification and Analytics services.

    Customer scoped endpoints require the `X-Customer-Id` header.
  version: 1.0.0
  license:
    name: ISC

servers:
  - url: http://localhost:8080
    description: Local API Gateway

tags:
  - name: Gateway
    description: Health and diagnostics
  - name: Cakes
    description: Catalog Service - product data and filtering
  - name: Basket
    description: Order Service - basket lifecycle
  - name: Orders
    description: Order Service - checkout and order history
  - name: Ratings
    description: Rating Service - verified customer reviews
  - name: Notifications
    description: Notification Service - order confirmations
  - name: Inventory
    description: Inventory Service - event driven stock reservation
  - name: Analytics
    description: Analytics Service - sales metrics

components:

  parameters:

    CustomerId:
      name: X-Customer-Id
      in: header
      required: true
      description: Identifies the current customer.
      schema:
        type: string
      example: customer-1001

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
          nullable: true

    Cake:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
          example: CHOCOLATE
        price:
          type: number
          format: double
          example: 34.50
        currency:
          type: string
          example: USD
        imageUrl:
          type: string
        stockQuantity:
          type: integer
        available:
          type: boolean
        averageRating:
          type: number
          nullable: true
          description: Merged in from the Rating Service; null when unrated or unavailable.
        ratingCount:
          type: integer
          nullable: true

    CakePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Cake"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    Category:
      type: object
      properties:
        value:
          type: string
          example: CHOCOLATE
        label:
          type: string
          example: Chocolate

    BasketItem:
      type: object
      properties:
        cakeId:
          type: string
        cakeName:
          type: string
        imageUrl:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        lineTotal:
          type: number

    Basket:
      type: object
      properties:
        basketId:
          type: string
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BasketItem"
        itemCount:
          type: integer
        subtotal:
          type: number
        deliveryFee:
          type: number
        tax:
          type: number
        total:
          type: number
        currency:
          type: string

    AddBasketItemRequest:
      type: object
      required: [cakeId, quantity]
      properties:
        cakeId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 50

    UpdateBasketItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 50

    CheckoutRequest:
      type: object
      required: [customerName, customerEmail, deliveryAddress]
      properties:
        customerName:
          type: string
          maxLength: 160
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
          description: Required when SMS is one of the notification channels.
        deliveryAddress:
          type: string
        deliveryNotes:
          type: string
        notificationChannels:
          type: array
          default: [EMAIL]
          items:
            type: string
            enum: [EMAIL, SMS, IN_APP]

    OrderItem:
      type: object
      properties:
        cakeId:
          type: string
        cakeName:
          type: string
        imageUrl:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        lineTotal:
          type: number

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          example: CD-20260813-UTHQ
        customerId:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
          nullable: true
        deliveryAddress:
          type: string
        deliveryNotes:
          type: string
          nullable: true
        notificationChannels:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, PREPARING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        subtotal:
          type: number
        deliveryFee:
          type: number
        tax:
          type: number
        total:
          type: number
        currency:
          type: string
        placedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    Rating:
      type: object
      properties:
        id:
          type: string
        cakeId:
          type: string
        customerId:
          type: string
        stars:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          nullable: true
        orderId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRatingRequest:
      type: object
      required: [cakeId, orderId, stars]
      properties:
        cakeId:
          type: string
        orderId:
          type: string
          description: The order the purchase is verified against.
        stars:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          maxLength: 1000

    RatingSummary:
      type: object
      properties:
        cakeId:
          type: string
        averageRating:
          type: number
          nullable: true
        ratingCount:
          type: integer
        distribution:
          type: object
          additionalProperties:
            type: integer

    Notification:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        orderId:
          type: string
        customerId:
          type: string
        channel:
          type: string
          enum: [EMAIL, SMS, IN_APP]
        recipient:
          type: string
        subject:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [PENDING, SENT, FAILED]
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true

    Inventory:
      type: object
      properties:
        cakeId:
          type: string
        cakeName:
          type: string
        stockQuantity:
          type: integer
        reservedQuantity:
          type: integer
        availableQuantity:
          type: integer

paths:

  # ==========================================================
  # GATEWAY
  # ==========================================================

  /health:
    get:
      tags: [Gateway]
      summary: API Gateway health check
      responses:
        "200":
          description: Gateway is healthy

  /health/services:
    get:
      tags: [Gateway]
      summary: Aggregated health of every downstream service
      responses:
        "200":
          description: All services are up
        "503":
          description: At least one service is unreachable

  # ==========================================================
  # CAKES
  # ==========================================================

  /api/v1/cakes:
    get:
      tags: [Cakes]
      summary: List cakes with optional filters
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: search
          in: query
          description: Matches name or description.
          schema: { type: string }
        - name: available
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, price, category, createdAt]
            default: name
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: includeRatings
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: A page of cakes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CakePage"
        "400":
          description: Invalid filter or paging values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Cakes]
      summary: Create a cake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cake"
      responses:
        "201":
          description: Cake created
        "400":
          description: Validation failed

  /api/v1/cakes/categories:
    get:
      tags: [Cakes]
      summary: List the distinct categories in the catalogue
      responses:
        "200":
          description: Categories with display labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /api/v1/cakes/batch:
    get:
      tags: [Cakes]
      summary: Bulk cake lookup
      description: Used by the Order Service to re-price a basket at checkout.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma separated cake ids, maximum 200.
          schema: { type: string }
      responses:
        "200":
          description: Matching cakes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cake"
        "400":
          description: Missing or oversized id list

  /api/v1/cakes/{cakeId}:
    parameters:
      - name: cakeId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Cakes]
      summary: Get a cake by id
      responses:
        "200":
          description: The cake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cake"
        "404":
          description: Cake not found
    put:
      tags: [Cakes]
      summary: Update a cake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cake"
      responses:
        "200":
          description: Updated cake
        "404":
          description: Cake not found
    delete:
      tags: [Cakes]
      summary: Delete a cake
      responses:
        "204":
          description: Deleted
        "404":
          description: Cake not found

  # ==========================================================
  # BASKET
  # ==========================================================

  /api/v1/basket:
    get:
      tags: [Basket]
      summary: Get the current basket with calculated totals
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The basket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Basket"
        "400":
          description: Missing X-Customer-Id
    delete:
      tags: [Basket]
      summary: Empty the basket
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The empty basket

  /api/v1/basket/items:
    post:
      tags: [Basket]
      summary: Add a cake to the basket
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBasketItemRequest"
      responses:
        "200":
          description: The updated basket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Basket"
        "400":
          description: Invalid quantity, cake unavailable, or not enough stock
        "404":
          description: Cake not found

  /api/v1/basket/items/{cakeId}:
    parameters:
      - name: cakeId
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/CustomerId"
    put:
      tags: [Basket]
      summary: Set the quantity of a basket item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBasketItemRequest"
      responses:
        "200":
          description: The updated basket
        "400":
          description: Invalid quantity or not enough stock
        "404":
          description: Basket item not found
    delete:
      tags: [Basket]
      summary: Remove an item from the basket
      responses:
        "200":
          description: The updated basket
        "404":
          description: Basket item not found

  # ==========================================================
  # ORDERS
  # ==========================================================

  /api/v1/orders/checkout:
    post:
      tags: [Orders]
      summary: Check out the basket and create an order
      description: |
        Re-prices every item against the Catalog Service, creates the order and
        its items, clears the basket and writes the `order.completed` event to
        the transactional outbox - all in one database transaction.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation failed or the basket is empty
        "409":
          description: A cake is gone, unavailable, or out of stock

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List the customer's orders
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PREPARING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
      responses:
        "200":
          description: A page of orders

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get an order by id
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found for this customer

  /api/v1/orders/by-number/{orderNumber}:
    get:
      tags: [Orders]
      summary: Get an order by order number
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The order
        "404":
          description: Order not found

  /api/v1/orders/{orderId}/status:
    patch:
      tags: [Orders]
      summary: Advance the order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PREPARING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
      responses:
        "200":
          description: The updated order
        "409":
          description: Transition not allowed from the current status

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The cancelled order
        "409":
          description: The order can no longer be cancelled

  # ==========================================================
  # RATINGS
  # ==========================================================

  /api/v1/ratings:
    post:
      tags: [Ratings]
      summary: Submit or update a rating for a purchased cake
      description: |
        The Rating Service calls the Order Service to confirm the customer owns
        the order and that the cake was on it before storing the review.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRatingRequest"
      responses:
        "201":
          description: Rating stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          description: Validation failed
        "403":
          description: The cake was not purchased on that order
        "404":
          description: Order not found for this customer

  /api/v1/ratings/summary:
    get:
      tags: [Ratings]
      summary: Bulk rating summaries
      description: Used by the Catalog Service to enrich cake listings.
      parameters:
        - name: cakeIds
          in: query
          required: true
          description: Comma separated cake ids.
          schema: { type: string }
      responses:
        "200":
          description: One summary per requested cake
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RatingSummary"

  /api/v1/ratings/cake/{cakeId}:
    get:
      tags: [Ratings]
      summary: List reviews for a cake
      parameters:
        - name: cakeId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: A page of ratings

  /api/v1/ratings/cake/{cakeId}/summary:
    get:
      tags: [Ratings]
      summary: Average rating and star distribution for a cake
      parameters:
        - name: cakeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingSummary"

  /api/v1/ratings/customer/{customerId}:
    get:
      tags: [Ratings]
      summary: List reviews written by a customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: A page of ratings

  /api/v1/ratings/{ratingId}:
    parameters:
      - name: ratingId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Ratings]
      summary: Get a rating by id
      responses:
        "200":
          description: The rating
        "404":
          description: Rating not found
    delete:
      tags: [Ratings]
      summary: Delete a rating
      responses:
        "204":
          description: Deleted
        "404":
          description: Rating not found

  # ==========================================================
  # NOTIFICATIONS
  # ==========================================================

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Notification history for the current customer
      description: Created asynchronously after the order.completed event is consumed.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "400":
          description: Missing X-Customer-Id

  /api/v1/notifications/customer/{customerId}:
    get:
      tags: [Notifications]
      summary: Notification history for a specific customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notifications, newest first

  # ==========================================================
  # INVENTORY
  # ==========================================================

  /api/v1/inventory/{cakeId}:
    get:
      tags: [Inventory]
      summary: Stock levels for a cake
      parameters:
        - name: cakeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stock, reserved and available quantities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "404":
          description: No stock record for this cake

  # ==========================================================
  # ANALYTICS
  # ==========================================================

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Total orders, revenue and items sold
      responses:
        "200":
          description: Aggregated totals, excluding cancelled orders

  /api/v1/analytics/top-cakes:
    get:
      tags: [Analytics]
      summary: Best selling cakes by quantity
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Ranked cakes with quantity sold and revenue

  /api/v1/analytics/daily-revenue:
    get:
      tags: [Analytics]
      summary: Orders and revenue per day
      responses:
        "200":
          description: One entry per day, newest first
